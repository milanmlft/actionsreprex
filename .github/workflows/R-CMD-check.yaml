# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Install dev dependencies
        run: |
          Rscript -e 'renv::install()'

      - name: Record renv library path
        run: |
          RENV_LIBRARY_PATH=$(Rscript -e 'renv::paths$library()')
          echo "RENV_LIBRARY_PATH=$RENV_LIBRARY_PATH" >> $GITHUB_ENV

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Check cached paths
        continue-on-error: true
        run: |
          ls -lhrt /home/runner/work/_temp/renv &&
          ls -lhrt renv/library &&
          ls -lhrt ~/work/actionsreprex/actionsreprex/renv/library &&
          du -hs /home/runner/work/_temp/renv/* &&
          du -hs renv/library &&
          du -hs ~/work/actionsreprex/actionsreprex/renv/library

      - name: Check renv library path
        continue-on-error: true
        run: |
          ls $RENV_LIBRARY_PATH &&
          du -hs $RENV_LIBRARY_PATH
